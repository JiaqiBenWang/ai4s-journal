<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 72" width="560" height="72">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A960"/>
      <stop offset="50%" stop-color="#F5C888"/>
      <stop offset="100%" stop-color="#E8A960"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(48,36) scale(0.82)">
    <g opacity="0.4">
      <polygon points="0,-34 29.4,-17 29.4,17 0,34 -29.4,17 -29.4,-17" fill="none" stroke="#E8A960" stroke-width="2.5"/>
    </g>
    <g opacity="0.3">
      <polygon points="0,-21 18.2,-10.5 18.2,10.5 0,21 -18.2,10.5 -18.2,-10.5" fill="none" stroke="#F5C888" stroke-width="1.5"/>
    </g>
    <g opacity="0.6">
      <line x1="0" y1="-5.5" x2="0" y2="-17" stroke="#E8A960" stroke-width="1.2"/>
      <line x1="4.8" y1="-3" x2="14" y2="-8" stroke="#E8A960" stroke-width="1.2"/>
      <line x1="4.8" y1="3" x2="14" y2="8" stroke="#E8A960" stroke-width="1.2"/>
      <line x1="0" y1="5.5" x2="0" y2="17" stroke="#E8A960" stroke-width="1.2"/>
      <line x1="-4.8" y1="3" x2="-14" y2="8" stroke="#E8A960" stroke-width="1.2"/>
      <line x1="-4.8" y1="-3" x2="-14" y2="-8" stroke="#E8A960" stroke-width="1.2"/>
    </g>
    <circle cx="0" cy="0" r="6" fill="url(#gold)" filter="url(#glow)"/>
    <circle cx="0" cy="-20" r="3.5" fill="#F5C888" opacity="0.85"/>
    <circle cx="17.3" cy="-10" r="3.5" fill="#F5C888" opacity="0.85"/>
    <circle cx="17.3" cy="10" r="3.5" fill="#F5C888" opacity="0.85"/>
    <circle cx="0" cy="20" r="3.5" fill="#F5C888" opacity="0.85"/>
    <circle cx="-17.3" cy="10" r="3.5" fill="#F5C888" opacity="0.85"/>
    <circle cx="-17.3" cy="-10" r="3.5" fill="#F5C888" opacity="0.85"/>
    <g opacity="0.75">
      <path d="M-4,-14 L-4,3 L-14,19 L-14,27 L14,27 L14,19 L4,3 L4,-14" fill="none" stroke="#F5C888" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Text -->
  <text x="120" y="38" font-family="'Georgia','Playfair Display',serif" font-weight="700" font-size="36" letter-spacing="-0.5">
    <tspan fill="url(#gold)">AI</tspan><tspan fill="#F5F0EB">4S</tspan>
  </text>

  <text x="122" y="56" font-family="'Inter',system-ui,sans-serif" font-weight="600" font-size="11" fill="#D4B896" letter-spacing="4">
    JOURNALS
  </text>

  <line x1="122" y1="62" x2="300" y2="62" stroke="#E8A960" stroke-width="0.7" opacity="0.5"/>

  <text x="122" y="74" font-family="'Inter',system-ui,sans-serif" font-weight="400" font-size="8" fill="#B0A090" letter-spacing="1.5">
    ADVANCING SCIENCE THROUGH AI
  </text>
</svg>
